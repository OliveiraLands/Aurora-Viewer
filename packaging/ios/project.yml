name: OliViewer
options:
  bundleIdPrefix: com.oliveiralands
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: OliViewer
    PRODUCT_BUNDLE_IDENTIFIER: com.oliveiralands.oliviewer
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_VERSION: "5.0"

targets:
  OliViewer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OliViewer
    settings:
      base:
        INFOPLIST_FILE: OliViewer/Info.plist
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../../target/aarch64-apple-ios/release"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-laurora_viewer"
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMotion.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: WebKit.framework
      - sdk: GameController.framework
